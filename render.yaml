# Render.com blueprint — API + built SPA on one service, plus PostGIS.
databases:
  - name: northern-trails-db
    databaseName: northern_trails
    user: northern
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: northern-trails
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render injects the connection string; PostGIS must be enabled once
      # with: CREATE EXTENSION postgis;  (the app attempts this on startup).
      - key: DATABASE_URL
        fromDatabase:
          name: northern-trails-db
          property: connectionString
      - key: POLL_ENABLED
        value: "1"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CORS_ORIGINS
        value: "*"
      # Secrets — set these in the Render dashboard, never in the repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PAYMENTS_PROVIDER
        sync: false
      - key: JAZZCASH_MERCHANT_ID
        sync: false
      - key: JAZZCASH_PASSWORD
        sync: false
      - key: JAZZCASH_INTEGRITY_SALT
        sync: false
      - key: EASYPAISA_STORE_ID
        sync: false
      - key: EASYPAISA_HASH_KEY
        sync: false
